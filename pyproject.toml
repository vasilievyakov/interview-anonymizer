[project]
name = "interview-anonymizer"
version = "0.1.0"
description = "Interview anonymizer: local anonymizer for tables and texts (Russian and English) before sending them to a cloud LLM, with reversible restore."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.15"
dependencies = [
    "natasha>=1.6",
    "spacy>=3.7,<3.9",
    "openpyxl>=3.1",
    "python-docx>=1.1",
    "cryptography>=42",
    "setuptools<81",  # pymorphy2 (natasha) imports pkg_resources
    "ru-core-news-sm @ https://github.com/explosion/spacy-models/releases/download/ru_core_news_sm-3.8.0/ru_core_news_sm-3.8.0-py3-none-any.whl",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
]

[project.scripts]
anon = "anon.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "anon"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["models: tests that need natasha/spacy models"]
